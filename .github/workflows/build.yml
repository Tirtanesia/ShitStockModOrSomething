name: Build Nebula

on:
  workflow_dispatch
  
jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [c1s]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a
      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            attr ccache clang ffmpeg libbrotli-dev libbz2-dev \
            libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev lld protobuf-compiler webp \
            build-essential g++-aarch64-linux-gnu gcc-aarch64-linux-gnu \
            python-is-python3 python3 wget curl
          KERNEL_VER="$(uname -r)"
          if (( ${KERNEL_VER%%.*} < 7 )); then
            DEBIAN_FRONTEND=noninteractive sudo apt install -yq "linux-modules-extra-${KERNEL_VER}" || true
          fi
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          rustc --version
          cargo --version
          wget https://raw.githubusercontent.com/kdrag0n/kramflash/refs/heads/master/mkbootimg.py && sudo ln -sf $(pwd)/mkbootimg.py /usr/bin/mkbootimg && chmod +x /usr/bin/mkbootimg
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem
          
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-unknown-linux-gnu

      - name: Build dependencies
        run: |
          chmod +x scripts/internal/gen_config_file.sh
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh
          
      - name: Download stock firmwares
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_on: error
          command: source ./buildenv.sh ${{ matrix.target }} && ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh
          
      - name: Add swap space
        run: |
          SWAP_FILE=$(swapon --show=NAME | tail -n 1)
          if [ -n "$SWAP_FILE" ]; then
            echo "Existing swap found: $SWAP_FILE"
            sudo swapoff "$SWAP_FILE"
            sudo rm -f "$SWAP_FILE"
          else
            SWAP_FILE="/swapfile"
            echo "No existing swap found. Creating $SWAP_FILE"
          fi
          sudo fallocate -l 12G "$SWAP_FILE"
          sudo chmod 600 "$SWAP_FILE"
          sudo mkswap "$SWAP_FILE"
          sudo swapon "$SWAP_FILE"
          echo "Swap configured:"
          free -h
          swapon --show
      
      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh
          
      - name: Upload c1s ROM artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nebula
          path: |
            out/*.tar*
            out/*.zip*
      - name: Upload ROM to Pixeldrain
        env:
          PIXELDRAIN_API_KEY: ${{ secrets.PIXELDRAIN_API_KEY }}
        run: |
          for file in out/*.tar* out/*.zip*; do
            if [ -f "$file" ]; then
              FILENAME=$(basename "$file")
              FILESIZE=$(du -h "$file" | cut -f1)
              echo "Mengunggah $FILENAME ($FILESIZE) ke Pixeldrain..."
              
              RESPONSE=$(curl -f -T "$file" -u ":$PIXELDRAIN_API_KEY" "https://pixeldrain.com")
              FILE_ID=$(echo "$RESPONSE" | jq -r '.id')
              
              if [ "$FILE_ID" != "null" ] && [ -n "$FILE_ID" ]; then
                echo "=========================================="
                echo "Berhasil! Link download ($FILENAME):"
                echo "https://pixeldrain.com"
                echo "=========================================="
              else
                echo "Gagal mengunggah $FILENAME. Respon API: $RESPONSE"
                exit 1
              fi
            fi
          done
       
